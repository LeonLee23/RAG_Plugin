[project]
name = "rag-plugin"
version = "0.1.0"
description = "Evidence-first RAG demo with PostgreSQL, Streamlit and MCP"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4", "pgvector>=0.4,<1", "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1", "mcp>=1.12,<2", "streamlit>=1.45,<2",
  "pymupdf>=1.25,<2", "python-docx>=1.1,<2", "jieba>=0.42,<1",
  "numpy>=2,<3", "pillow>=11,<13", "psutil>=7,<8", "tokenizers>=0.22,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires isolated PostgreSQL", "live_model: explicitly enabled real model probe"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
