[project]
name = "rag-plugin"
version = "2.0.0"
description = "Portable file knowledge bases for Codex and Claude Code over local stdio MCP"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp>=1.12,<2", "pydantic>=2.7,<3", "pymupdf>=1.25,<2",
  "python-docx>=1.1,<2", "jieba>=0.42,<1", "pillow>=11,<13",
  "markdown-it-py>=3,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: real files, processes and stdio MCP", "live_model: explicitly enabled host acceptance"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
