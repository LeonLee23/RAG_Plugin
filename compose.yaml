name: rag-plugin
services:
  db:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_demo}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_local_demo}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    image: rag-plugin:local
    build: .
    init: true
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000']
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - document-data:/data
      - cli-home:/home/app
    ports: ['127.0.0.1:${BACKEND_PORT:-8000}:8000']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12
  frontend:
    image: rag-plugin:local
    build: .
    command: [streamlit, run, ui/streamlit_app.py, --server.address=0.0.0.0, --server.port=8501]
    environment:
      BACKEND_URL: http://backend:8000
    depends_on: [backend]
    ports: ['127.0.0.1:${FRONTEND_PORT:-8501}:8501']
volumes:
  pg-data:
  document-data:
  cli-home:
